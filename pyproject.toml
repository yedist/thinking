
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "thinking"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
